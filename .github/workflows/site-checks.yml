name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-checks:
    name: Site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          trap 'rm -rf "$scanner_dir"' EXIT
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --config .gitleaks.toml --log-opts='--all' \
            --redact=100 --ignore-gitleaks-allow --no-banner
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build and check site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.cjs
          node tests/security.test.cjs
          node tests/paper.test.cjs
          node tests/print.test.cjs
          node tests/site.test.cjs
          node tests/site.test.cjs --bundle
          node tests/site.test.cjs --no-resize-observer
          node tests/site.test.cjs --bundle --no-resize-observer
          node tests/pages.test.cjs
          node tests/reading.test.cjs
          node tests/milestones.test.cjs
          node tests/milestones.test.cjs --bundle
          node tests/reading-paths.test.cjs
          node tests/reading-paths.test.cjs --bundle
          git diff --exit-code
          git diff --check
