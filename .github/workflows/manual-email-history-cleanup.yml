name: Manual email-history cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first. Rewrite changes public branch history.
        type: choice
        options: [preview, rewrite]
        default: preview
        required: true
      confirmation:
        description: For rewrite only, type REWRITE CSB HISTORY
        type: string
        default: ''
      backup_confirmed:
        description: I have a verified private backup of the current website and history
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: csb-email-history-maintenance
  cancel-in-progress: false

jobs:
  preview:
    name: Verify cleanup without publishing
    if: github.ref == 'refs/heads/main' && github.actor == 'ColoradoStreetBridgeBarrierProject'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.verify.outputs.snapshot }}
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check safety guards
        run: node --test .github/maintenance/clean-email-history.test.mjs
      - name: Install pinned cleanup dependency
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --target "$RUNNER_TEMP/csb-email-deps" -r .github/maintenance/email-cleanup-requirements.txt
      - name: Verify every commit without pushing
        id: verify
        run: node .github/maintenance/clean-email-history.mjs
        env:
          CSB_MODE: preview
          PYTHONPATH: ${{ runner.temp }}/csb-email-deps

  rewrite:
    name: Explicitly authorized history rewrite
    needs: preview
    if: inputs.mode == 'rewrite' && inputs.confirmation == 'REWRITE CSB HISTORY' && inputs.backup_confirmed == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check safety guards
        run: node --test .github/maintenance/clean-email-history.test.mjs
      - name: Install pinned cleanup dependency
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --target "$RUNNER_TEMP/csb-email-deps" -r .github/maintenance/email-cleanup-requirements.txt
      - name: Recheck and publish only the verified branch histories
        run: node .github/maintenance/clean-email-history.mjs
        env:
          CSB_MODE: rewrite
          CSB_CONFIRMATION: ${{ inputs.confirmation }}
          CSB_BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          CSB_EXPECTED_SNAPSHOT: ${{ needs.preview.outputs.snapshot }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ runner.temp }}/csb-email-deps
      - name: Protection reminder
        if: always()
        run: printf '%s\n' 'Restore the original publishing protections now, regardless of whether the rewrite succeeded or failed. This workflow never changes protection settings.'
